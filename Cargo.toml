[workspace]
resolver = "2"
members = [
    "crates/contixis-proto",
    "crates/contixis-crypto",
    "crates/contixis-core",
    "crates/contixis-net",
    "crates/contixis-input",
    "crates/contixis-codec",
    "apps/agent",
    "apps/host/src-tauri",
    "apps/agent-ui/src-tauri",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
authors    = ["Contixis Team <dev@contixis.io>"]
license    = "BSL-1.1"
repository = "https://github.com/contixis/contixis"

[workspace.dependencies]
# Async runtime
tokio       = { version = "1", features = ["full"] }

# QUIC transport
quinn       = { version = "0.11", features = ["rustls-ring"] }
rustls      = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"

# Protocol
prost       = "0.13"
prost-build = "0.13"
bytes       = "1"

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Crypto
ring        = "0.17"
rcgen       = { version = "0.13", features = ["pem", "x509-parser"] }
rustls-native-certs = "0.8"

# Discovery
mdns-sd     = "0.11"

# Compression
zstd        = "0.13"

# Error handling
thiserror   = "2"
anyhow      = "1"

# Logging
tracing                 = "0.1"
tracing-subscriber      = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender        = "0.2"

# Utilities
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap     = "6"
once_cell   = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hostname    = "0.4"
rand        = "0.8"
base64      = "0.22"
hex         = "0.4"
base32      = "0.5"
subtle      = "2"
hmac        = "0.12"
sha2        = "0.10"

# Clipboard
arboard     = { version = "3", default-features = false, features = ["wayland-data-control"] }

# Config
toml        = "0.8"
dirs        = "5"
libc        = "0.2"

# Clap CLI
clap        = { version = "4", features = ["derive"] }

# Tauri (host app only)
tauri       = { version = "2", features = ["devtools"] }
tauri-build = { version = "2" }
tauri-plugin-shell = "2"

[profile.dev]
opt-level = 1

[profile.release]
opt-level  = 3
lto        = "thin"
strip      = true
panic      = "abort"
